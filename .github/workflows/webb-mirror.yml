name: Webb snapshot extract

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-extract even if the snapshot is unchanged"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/webb_*.py"
      - "scripts/webb_tables.txt"
      - ".github/workflows/webb-mirror.yml"
  schedule:
    - cron: "17 3 2 * *" # 2nd of each month, 03:17 UTC: check for a new snapshot

permissions:
  contents: write

concurrency:
  group: webb-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Remove withdrawn release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -v '^\s*#' scripts/withdrawn_assets.txt | while read -r tag asset cutoff; do
            [ -n "$tag" ] || continue
            info=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq ".assets[] | select(.name == \"${asset}\") | \"\(.id) \(.updated_at)\"" 2>/dev/null || true)
            if [ -z "$info" ]; then echo "not present: $tag/$asset"; continue; fi
            id=${info%% *}; updated=${info#* }
            if [[ "$updated" < "$cutoff" ]]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" && echo "deleted $tag/$asset (uploaded $updated)"
            else
              echo "keeping $tag/$asset (uploaded $updated, after cutoff)"
            fi
          done

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q p7zip-full
          pip install -q gdown==5.2.0 pyarrow==21.0.0

      - name: Download and extract
        id: run
        shell: bash
        run: |
          force=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force }}" = "true" ]; then force="--force"; fi
          python scripts/webb_pipeline.py --out "$RUNNER_TEMP/out" $force | tee -a "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/out" || true

      - name: Publish release assets
        if: steps.run.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="webb-${{ steps.run.outputs.snapshot }}"
          {
            echo "Selected tables from the Webb-site Repository snapshot ${{ steps.run.outputs.snapshot }}, converted to Parquet."
            echo
            echo "Data: Webb-site Repository by David M. Webb, licensed CC BY 4.0. See LICENSE-DATA.md for the original copyright notice and the changes made."
            echo "Table list, row counts and checksums: data/webb/manifest.json"
          } > "$RUNNER_TEMP/notes.md"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Webb-site extract ${{ steps.run.outputs.snapshot }}" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$tag" "$RUNNER_TEMP"/out/*.parquet --clobber

      - name: Commit manifest and schema
        if: steps.run.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/webb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Webb extract ${{ steps.run.outputs.snapshot }}"
          git pull --rebase origin main
          git push origin HEAD:main
